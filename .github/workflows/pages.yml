name: Deploy web app

# Publishes web/ to GitHub Pages. Geolocation needs a secure context, so the
# app cannot be tested by opening index.html from a file:// URL — it has to be
# served over HTTPS (or from localhost).
# No paths filter: a path filter is evaluated against a diff, and on the push
# that first creates a branch there isn't one, which silently skips the deploy
# you most wanted. A Pages build is ~30s on a free Linux runner; not worth the
# failure mode.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
