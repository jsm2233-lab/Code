<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Street Collector</title>
<meta name="description" content="Collect every street in your city.">

<!-- Home-screen install. apple-mobile-web-app-capable is the one that makes
     iOS drop the Safari chrome; the manifest alone does not. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streets">
<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<!-- Leaflet ships without subresource-integrity hashes here because they
     could not be verified from the build environment, and a wrong hash blocks
     the script outright. Vendor Leaflet locally, or add verified hashes, before
     treating this as production. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Gradient used by every progress ring in the app. -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="ringGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2de0a5"/>
      <stop offset="100%" stop-color="#36b8ff"/>
    </linearGradient>
    <linearGradient id="ringViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a86bf5"/>
      <stop offset="100%" stop-color="#ff5da2"/>
    </linearGradient>
    <linearGradient id="ringAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffbc3d"/>
      <stop offset="100%" stop-color="#ff5da2"/>
    </linearGradient>
  </defs>
</svg>

<div id="app">

  <!-- Map -->
  <section class="screen screen--map active" data-screen="map">
    <div id="map"></div>

    <div class="hud" id="hud"></div>
    <div class="toasts" id="toasts"></div>

    <div class="controls">
      <button class="glass-button" id="btn-suggest" aria-label="Nearby streets to collect">🎯</button>
      <button class="primary-button" id="btn-trip">Start collecting</button>
      <button class="glass-button" id="btn-locate" aria-label="Recentre">📍</button>
    </div>
  </section>

  <!-- Collection -->
  <section class="screen" data-screen="streets">
    <h1 class="screen-title">Collection</h1>
    <input class="search" id="street-search" type="search" placeholder="Search streets" autocomplete="off">
    <div class="filter-bar" id="street-filters"></div>
    <div id="street-list"></div>
  </section>

  <!-- Stats -->
  <section class="screen" data-screen="stats">
    <h1 class="screen-title">Stats</h1>
    <div id="stats-body"></div>
  </section>

  <!-- Badges -->
  <section class="screen" data-screen="badges">
    <h1 class="screen-title">Badges</h1>
    <div id="badges-body"></div>
  </section>

  <!-- Settings -->
  <section class="screen" data-screen="settings">
    <h1 class="screen-title">Settings</h1>
    <div id="settings-body"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button data-tab="map" class="active"><span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13"/><path d="M15 6.5v13"/></svg></span>Map</button>
    <button data-tab="streets"><span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>Streets</button>
    <button data-tab="stats"><span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></span>Stats</button>
    <button data-tab="badges"><span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="m8.5 13.5-1 7 4.5-2.5 4.5 2.5-1-7"/></svg></span>Badges</button>
    <button data-tab="settings"><span class="glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.9 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg></span>Settings</button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet" id="sheet"></div>
</div>

<div class="celebration" id="celebration">
  <canvas id="confetti"></canvas>
  <div class="celebration-card" id="celebration-card"></div>
</div>

<div class="onboarding hidden" id="onboarding"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
