name: Web

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies to install: the app has none, and the tests are plain
      # Node with assert.
      - name: Unit tests
        run: node web/tests/run.mjs

      - name: Lint
        run: npx --yes eslint@10 --config web/eslint.config.mjs web/js web/sw.js
