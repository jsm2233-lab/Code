name: Build

# Manual runs matter here: this repo is usually driven from a phone, where
# "Run workflow" in mobile Safari is the only build button available.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Deliberately NOT pinning an Xcode version. Homebrew installs the newest
      # XcodeGen, which writes the newest project format, so pinning an older
      # Xcode guarantees "the project is in a future Xcode project file format"
      # — which is exactly how this workflow failed the first time.
      - name: Show toolchain
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen --version
          xcodegen generate

      # Simulator names churn with every Xcode release, so pinning "iPhone 15"
      # is a time bomb. Take whatever iPhone this runner actually has, by UDID
      # so the name never has to be quoted or matched again.
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c 'import json,sys;d=json.load(sys.stdin)["devices"];print(next(x["udid"] for r in sorted(d) if "iOS" in r for x in d[r] if x.get("isAvailable") and "iPhone" in x["name"]))')
          echo "Using simulator $udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Code signing is off: this job proves the code compiles, it does not
      # produce anything installable. See README for the TestFlight path.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project StreetCollector.xcodeproj \
            -scheme StreetCollector \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      # The build log is the actual deliverable when there's no Mac to read
      # Xcode's error list on.
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/Library/Developer/Xcode/DerivedData/**/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7
