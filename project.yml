name: StreetCollector
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StreetCollector:
    type: application
    platform: iOS
    sources:
      - path: StreetCollector
    info:
      path: StreetCollector/Resources/Info.plist
      properties:
        CFBundleDisplayName: Street Collector
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - processing
        NSLocationWhenInUseUsageDescription: >-
          Street Collector needs your location to fill in the streets you travel
          down as you move.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Allow "Always" so Street Collector can keep collecting streets while
          the app is in your pocket or in the background.
        NSMotionUsageDescription: >-
          Motion data lets Street Collector tell walking from driving so it can
          score your trips correctly.
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.StreetCollector.tilePrefetch
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: StreetCollector/Resources/StreetCollector.entitlements
      properties:
        com.apple.developer.location.push: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StreetCollector
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  StreetCollectorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreetCollectorTests
    dependencies:
      - target: StreetCollector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.StreetCollectorTests
